name: Publish Research Learning Hub

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build-econometrics-public.cjs'
      - 'scripts/export-econometrics-word.py'
      - 'scripts/style-course-pages.cjs'
      - 'scripts/render-psmdid-math.cjs'
      - 'scripts/sync-econometrics-notion.cjs'
  workflow_dispatch:
  # Every four hours as a recovery path when GitHub App pushes do not
  # initiate Actions; this does not alter the ChatGPT lesson schedule.
  schedule:
    - cron: '15 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-learning-hub-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      latest_econometrics_id: ${{ steps.econometrics_latest.outputs.lesson_id }}
      latest_econometrics_title: ${{ steps.econometrics_latest.outputs.lesson_title }}
    steps:
      - name: Check out main branch
        uses: actions/checkout@v4

      - name: Validate published econometrics lessons
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');
          const catalogFile = 'docs/econometrics/catalog.js';
          const sandbox = { window: {} };
          vm.runInNewContext(fs.readFileSync(catalogFile, 'utf8'), sandbox, { timeout: 2000 });
          const chapters = sandbox.window.ECON_COURSE?.chapters;
          if (!Array.isArray(chapters) || chapters.length !== 10) throw Error('Expected 10 econometrics chapters');
          const lessons = chapters.flatMap(c => c.lessons);
          if (lessons.length !== 120) throw Error('Expected 120 planned lessons');
          const seen = new Set();
          let published = 0;
          for (const lesson of lessons) {
            if (!lesson.id || seen.has(lesson.id)) throw Error('Duplicate or missing lesson ID');
            seen.add(lesson.id);
            if (!lesson.published) continue;
            if (!/^lessons\/\d{2}-\d{2}\.html$/.test(lesson.url || '')) {
              throw Error('Unsafe or missing lesson URL for ' + lesson.id);
            }
            const file = path.join('docs/econometrics', lesson.url);
            if (!fs.existsSync(file)) throw Error('Published lesson is missing: ' + file);
            const html = fs.readFileSync(file, 'utf8');
            if (!/<!doctype html>/i.test(html) || html.length < 1500) {
              throw Error('Published lesson is incomplete: ' + file);
            }
            published++;
          }
          if (!published) throw Error('No published lessons');
          for (const file of ['docs/index.html', 'docs/econometrics/index.html', 'docs/.nojekyll']) {
            if (!fs.existsSync(file)) throw Error('Required site file missing: ' + file);
          }
          console.log('Validated ' + published + ' published lessons / 120; all public lesson links resolve to files.');
          NODE
          python3 scripts/validate-econometrics-v2.py

      - name: Validate published CSSCI lessons
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), vm = require('node:vm');
          const catalogFile = 'docs/cssci/catalog.js';
          const indexFile = 'docs/cssci/index.html';
          if (!fs.existsSync(catalogFile) || !fs.existsSync(indexFile)) {
            throw Error('CSSCI catalog or index missing');
          }
          const index = fs.readFileSync(indexFile, 'utf8');
          if (!index.includes('catalog.js') || !index.includes('id="papers"')) {
            throw Error('CSSCI homepage has no working catalog reference');
          }
          const ctx = {window:{}};
          vm.runInNewContext(fs.readFileSync(catalogFile,'utf8'), ctx, {timeout:2000});
          const records=ctx.window.CSSCI_CATALOG;
          if (!Array.isArray(records) || !records.length) throw Error('Empty CSSCI catalog');
          const ids=new Set(), urls=new Set(), dois=new Set();
          let published=0;
          for(const r of records){
            if(!r.id || ids.has(r.id)) throw Error('Missing or duplicate CSSCI ID');
            ids.add(r.id);
            if(!r.title || !r.date || !r.authors || !r.journal) throw Error('Incomplete bibliography: '+r.id);
            if(r.doi && dois.has(r.doi)) throw Error('Duplicate DOI: '+r.doi);
            if(r.doi)dois.add(r.doi);
            if(!['metadata','published'].includes(r.status)) throw Error('Unknown publication status: '+r.id);
            if(r.status==='metadata') {
              if(r.article_url)throw Error('Metadata-only entry wrongly marked published: '+r.id);
              continue;
            }
            if(!/^lessons\/\d{2}-\d{2}-\d{4}-\d{2}-\d{2}\.html$/.test(r.article_url||'')){
              throw Error('Invalid published lesson URL: '+r.id);
            }
            if(urls.has(r.article_url))throw Error('Duplicate lesson path: '+r.id);
            urls.add(r.article_url);
            const file=path.join('docs/cssci',r.article_url);
            if(!fs.existsSync(file))throw Error('Published lesson missing: '+file);
            const html=fs.readFileSync(file,'utf8');
            if(html.length<4000 || !/<!doctype html>/i.test(html)){
              throw Error('HTML lesson missing or incomplete: '+file);
            }
            for(let k=1;k<=7;k++){
              if(!html.includes('id="s'+k+'"'))throw Error('Module '+k+' missing: '+file);
            }
            if(!html.includes(r.title) || !html.includes(r.doi) ||
                !html.toLowerCase().includes('stata') || /&lt;mention-page/.test(html)){
              throw Error('Lesson content mismatch or unconverted Notion link: '+file);
            }
            published++;
          }
          if(!published)throw Error('No published CSSCI lessons');
          console.log('CSSCI: '+records.length+' bibliography records, '+published+' complete published lessons.');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare complete site and bust cached course catalogs
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site
          cp -a docs/. _site/
          node <<'NODE'
          const fs = require('node:fs');
          const sha = process.env.DEPLOY_SHA.slice(0, 12);
          const changes = [
            { file: '_site/index.html', regex: /src="econometrics\/catalog\.js(?:\?[^"]*)?"/g, target: 'econometrics/catalog.js' },
            { file: '_site/index.html', regex: /src="math\/catalog\.js(?:\?[^"]*)?"/g, target: 'math/catalog.js' },
            { file: '_site/index.html', regex: /src="assets\/hub\.js(?:\?[^"]*)?"/g, target: 'assets/hub.js' },
            { file: '_site/study/index.html', regex: /src="\.\.\/econometrics\/catalog\.js(?:\?[^"]*)?"/g, target: '../econometrics/catalog.js' },
            { file: '_site/study/index.html', regex: /src="\.\.\/math\/catalog\.js(?:\?[^"]*)?"/g, target: '../math/catalog.js' },
            { file: '_site/study/index.html', regex: /src="\.\.\/assets\/hub\.js(?:\?[^"]*)?"/g, target: '../assets/hub.js' },
            { file: '_site/econometrics/index.html', regex: /src="catalog\.js(?:\?[^"]*)?"/g, target: 'catalog.js' },
            { file: '_site/cssci/index.html', regex: /src="catalog\.js(?:\?[^"]*)?"/g, target: 'catalog.js' }
          ];
                    for (const item of changes) {
            const previous = fs.readFileSync(item.file, 'utf8');
            const updated = previous.replace(item.regex, 'src="' + item.target + '?v=' + sha + '"');
            if (updated === previous) throw Error('Cannot version catalog reference: ' + item.file);
            fs.writeFileSync(item.file, updated);
          }
          console.log('Prepared complete docs/ site and versioned catalog requests: ' + sha);
          NODE

      - name: Load complete lessons from authorized Notion source
        shell: bash
        env:
          ECON_NOTION_READ_TOKEN: ${{ secrets.ECON_NOTION_READ_TOKEN }}
        run: |
          node scripts/sync-econometrics-notion.cjs

      - name: Auto-index complete econometrics lessons for the published site
        shell: bash
        run: |
          node scripts/build-econometrics-public.cjs

      - name: Record newest econometrics lesson from the built artifact
        id: econometrics_latest
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs'),vm=require('node:vm');
          const ctx={window:{}};
          vm.runInNewContext(fs.readFileSync('_site/econometrics/catalog.js','utf8'),ctx);
          const list=ctx.window.ECON_COURSE.chapters.flatMap(c=>c.lessons);
          const latest=list.filter(l=>l.published&&l.url).at(-1);
          if(!latest)throw Error('Published economics course list is empty');
          console.log('lesson_id='+latest.id);
          console.log('lesson_title='+latest.title);
          NODE

      - name: Auto-index research frontier and validate lesson links
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path');
          const dir = '_site/frontier', indexFile = path.join(dir, 'index.html');
          if (!fs.existsSync(indexFile)) throw Error('Frontier archive index missing.');
          const issues = fs.readdirSync(dir)
            .filter(f => /^\d{4}-\d{2}-\d{2}\.html$/.test(f)).sort().reverse();
          if (!issues.length) throw Error('No archived frontier issues.');
          for (const file of issues) {
            const html = fs.readFileSync(path.join(dir, file), 'utf8');
            if (html.length < 1500 || !/<html\b/i.test(html) ||
                !/<h1\b/i.test(html) || !html.includes(file.slice(0,10))) {
              throw Error('Incomplete frontier HTML or mismatched issue date: ' + file);
            }
          }
          let index = fs.readFileSync(indexFile, 'utf8');
          const existing = Array.from(index.matchAll(/href=["'](\d{4}-\d{2}-\d{2}\.html)["']/g), x => x[1]);
          for (const linked of existing) {
            if (!issues.includes(linked)) throw Error('Frontier index contains broken issue link: ' + linked);
          }
          const missing = issues.filter(file => !existing.includes(file));
          if (missing.length) {
            const anchor = '<div class="paper"><h2>已整理日报</h2>';
            if (!index.includes(anchor)) throw Error('Frontier archive insertion marker was not found.');
            const cards = missing.map(file =>
              '<div class="eyebrow">ARCHIVE · ' + file.slice(0,10) + '</div>' +
              '<p><a href="' + file + '">阅读 ' + file.slice(0,10) + ' 完整前沿日报 →</a></p>'
            ).join('');
            index = index.replace(anchor, anchor + cards);
            fs.writeFileSync(indexFile, index);
            console.log('Automatically added missing frontier links:', missing.join(', '));
          }
          for (const file of issues) {
            if (!index.includes('href="' + file + '"')) throw Error('Published frontier index missing ' + file);
          }
          console.log('Validated ' + issues.length + ' frontier issue pages and public index links.');
          NODE

      - name: Apply shared visual design to six course sites
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          node scripts/style-course-pages.cjs


      - name: Statically render PSM-DID formulas with KaTeX (HTML + MathML)
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund katex@0.16.22
          node --check scripts/render-psmdid-math.cjs
          node scripts/render-psmdid-math.cjs

      - name: Verify all published lesson HTML layouts
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/assets/lesson-reader.js
          node --check docs/econometrics/study-progress.js
          grep -Fq 'econ-answer-fold' docs/econometrics/study-progress.js
          grep -Fq 'econ-reading-guide' docs/econometrics/study-progress.css
          grep -Fq 'disclosure.open = false' docs/assets/lesson-reader.js
          grep -Fq 'cr-reader-codefold' docs/assets/lesson-reader.css
          grep -Fq 'findCodeLanguage' docs/assets/lesson-reader.js
          node --check scripts/style-course-pages.cjs
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const names=['econometrics','math','cssci','frontier','economic-classics','psm-did'];
          let total=0;
          function scan(dir,out=[]){
            for(const entry of fs.readdirSync(dir,{withFileTypes:true})){
              const f=path.join(dir,entry.name);
              if(entry.isDirectory())scan(f,out);
              else if(entry.isFile() && f.endsWith('.html'))out.push(f);
            }
            return out;
          }
          function innerBody(html){
            return html.match(/<body\b[^>]*>([\s\S]*?)<\/body>/i)?.[1]??null;
          }
          for(const course of names){
            let count=0;
            for(const source of scan(path.join('docs',course))){
              const rel=path.relative(path.join('docs',course),source);
              if(rel==='index.html')continue;
              const built=path.join('_site',course,rel);
              if(!fs.existsSync(built))throw Error('Built lesson missing: '+built);
              const original=fs.readFileSync(source,'utf8');
              const output=fs.readFileSync(built,'utf8');
              // Independent econometrics v2 pages and immutable snapshots own
              // their layout; verify exact preservation instead of injecting
              // the legacy reader. Scheduling and Notion steps are unchanged.
              const econIndependent=course==='econometrics' &&
                (rel.split(path.sep).some(s=>s==='v2'||s==='archive') ||
                 original.includes('name="course-revision"'));
              if(econIndependent){
                if(output!==original)throw Error('Independent page or archive changed: '+built);
                if(!rel.split(path.sep).includes('archive') &&
                   (!output.includes('course.css') || !output.includes('course.js')))
                  throw Error('Independent reader assets missing: '+built);
                count++;total++;continue;
              }
              if(innerBody(original)===null || innerBody(output)===null)
                throw Error('Invalid lesson HTML: '+built);
              if(course==='psm-did'){
                // Static math conversion changes rendered TeX while preserving
                // headings, code blocks, layout and lesson prose.
                if(!output.includes('speaking-layout.css') ||
                   !output.includes('academic-eye-care.css') ||
                   !output.includes('academic-rich.css') ||
                   !output.includes('lesson-template.css') ||
                   !output.includes('class="sp-dashboard"') ||
                   !output.includes('class="sp-pathway"') ||
                   !output.includes('katex.min.css') ||
                   !output.includes('class="speaking-study"') ||
                   !output.includes('class="study-layout"') ||
                   output.includes('lesson-reader.js') ||
                   output.includes('data-course-lesson="true"'))
                  throw Error('PSM-DID standalone math layout invalid: '+built);
                for(const tag of ['pre','h2','table']){
                  const re=new RegExp('<'+tag+'\\b','gi');
                  if((original.match(re)||[]).length!==(output.match(re)||[]).length)
                    throw Error('PSM-DID original '+tag+' nodes changed: '+built);
                }
                if(/(?:\\\\\[|\\$\\$)/.test(original) &&
                   !output.includes('class="katex-display"'))
                  throw Error('Display formula not rendered in '+built);
                if(output.includes('cdn.jsdelivr.net/npm/mathjax'))
                  throw Error('Stale client MathJax loader remains in '+built);
              }else{
                if(innerBody(output)!==innerBody(original))
                  throw Error('Lesson body unexpectedly changed: '+built);
                for(const marker of ['data-course-lesson="true"','lesson-reader.css','lesson-reader.js','course-themes.css']){
                  if(!output.includes(marker))throw Error('Missing '+marker+' in '+built);
                }
                if(!/<script\b[^>]+lesson-reader\.js[^>]*><\/script>/i.test(output))
                  throw Error('Reader script tag malformed: '+built);
              }
              count++;total++;
            }
            if(count<2)throw Error('Too few archived lessons in '+course);
            console.log('PASS '+course+': '+count+' preserved and enhanced lessons');
          }
          if(total<63)throw Error('Expected at least 63 existing lessons: '+total);
          console.log('PASS '+total+' lesson bodies preserved with valid lesson CSS / JS assets.');
          NODE

      - name: Export ten complete econometrics chapters and full 120-lesson Word book
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/econ-word-venv
          /tmp/econ-word-venv/bin/python -m pip install -q beautifulsoup4 python-docx
          if ! command -v pandoc >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq pandoc
          fi
          /tmp/econ-word-venv/bin/python scripts/export-econometrics-word.py \
             --source docs/econometrics --output _site/econometrics/word
          /tmp/econ-word-venv/bin/python - <<'PY'
          from pathlib import Path
          import json,zipfile
          root=Path('_site/econometrics/word')
          m=json.loads((root/'manifest.json').read_text())
          assert (m['chapters'],m['lessons'],m['taught'],m['prewritten']) == (10,120,20,100)
          assert len(m['documents'])==11
          assert sum(x['lessons'] for x in m['documents'][:-1])==120
          for item in m['documents']:
            p=root/item['filename']
            assert p.stat().st_size>8000 and zipfile.is_zipfile(p)
            with zipfile.ZipFile(p) as z:
              assert 'word/document.xml' in z.namelist()
          print('Verified 10 chapter DOCX files plus the full 120-lesson DOCX')
          PY

      - name: Upload complete site for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  verify-public-cssci:
    name: Verify public CSSCI pages
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out current source
        uses: actions/checkout@v4

      - name: Check HTTP 200, catalog freshness and latest published lesson
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SITE="https://ericywh.github.io/research-learning-hub/cssci"
          node <<'NODE' > /tmp/cssci-latest.txt
          const fs=require('node:fs'),vm=require('node:vm');
          const ctx={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/cssci/catalog.js','utf8'),ctx);
          const latest=ctx.window.CSSCI_CATALOG
            .filter(r=>r.status==='published'&&r.article_url)
            .sort((a,b)=>b.date.localeCompare(a.date))[0];
          if(!latest)process.exit(2);
          console.log(latest.article_url);
          console.log(latest.id);
          console.log(latest.title);
          NODE
          LATEST_PATH=$(sed -n '1p' /tmp/cssci-latest.txt)
          LATEST_ID=$(sed -n '2p' /tmp/cssci-latest.txt)
          LATEST_TITLE=$(sed -n '3p' /tmp/cssci-latest.txt)
          check() {
            local url="$1" output="$2" marker="$3"
            for attempt in $(seq 1 10); do
              status=$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$output" -w '%{http_code}' "$url?deploy=$DEPLOY_SHA" || true)
              if [[ "$status" == "200" ]] && grep -Fq "$marker" "$output"; then
                echo "PASS HTTP 200 + expected content: $url"
                return 0
              fi
              echo "Attempt $attempt: status $status or expected marker not yet deployed at $url"
              sleep 12
            done
            echo "::error::Public GitHub Pages URL failed external HTTP and content check: $url"
            return 1
          }
          check "$SITE/" /tmp/cssci-index.html 'CSSCI实证论文'
          check "$SITE/catalog.js" /tmp/cssci-catalog.js "$LATEST_ID"
          check "$SITE/$LATEST_PATH" /tmp/cssci-lesson.html "$LATEST_TITLE"
          grep -Fq 'id="s7"' /tmp/cssci-lesson.html
          grep -Fq 'Stata' /tmp/cssci-lesson.html
          echo "CSSCI GitHub Pages HTTPS smoke test passed: index, catalog and latest complete lesson."

  verify-public-frontier:
    name: Verify public frontier pages
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out published source
        uses: actions/checkout@v4

      - name: Check frontier archive and latest issues over HTTPS
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SITE="https://ericywh.github.io/research-learning-hub/frontier"
          mapfile -t ISSUES < <(find docs/frontier -maxdepth 1 -type f -name '????-??-??.html' -printf '%f\n' | sort -r | head -n 2)
          if (( ${#ISSUES[@]} == 0 )); then
            echo "::error::No frontier lesson found in repository."
            exit 1
          fi
          check() {
            local url="$1" expected="$2" output="$3" status
            for attempt in $(seq 1 10); do
              status=$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$output" -w '%{http_code}' "$url?deploy=$DEPLOY_SHA" || true)
              if [[ "$status" == "200" ]] && grep -Fq "$expected" "$output"; then
                echo "PASS HTTP 200 and expected content: $url"
                return 0
              fi
              echo "Attempt $attempt: status=$status or expected marker missing at $url"
              sleep 12
            done
            echo "::error::Frontier public URL failed HTTP/content check: $url"
            return 1
          }
          check "$SITE/" "${ISSUES[0]}" /tmp/frontier-index.html
          for issue in "${ISSUES[@]}"; do
            check "$SITE/$issue" "${issue%.html}" "/tmp/frontier-$issue"
          done
          echo "Frontier public smoke test passed: archive index and ${#ISSUES[@]} latest issues."

  verify-public-econometrics:
    name: Verify public econometrics pages
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source for expected lesson list
        uses: actions/checkout@v4

      - name: Verify deployed index, catalog and newest full lesson over HTTPS
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
          EXPECTED_ID: ${{ needs.build.outputs.latest_econometrics_id }}
          EXPECTED_TITLE: ${{ needs.build.outputs.latest_econometrics_title }}
        run: |
          set -euo pipefail
          SITE="https://ericywh.github.io/research-learning-hub/econometrics"
          LATEST_ID="$EXPECTED_ID"
          LATEST_TITLE="$EXPECTED_TITLE"
          [[ -n "$LATEST_ID" && -n "$LATEST_TITLE" ]] || { echo "::error::Build did not export a latest lesson"; exit 1; }
          check() {
            local url="$1" output="$2" marker="$3" status
            for attempt in $(seq 1 10); do
              status=$(curl -L -sS --connect-timeout 10 --max-time 30 \
                -o "$output" -w '%{http_code}' "$url?deploy=$DEPLOY_SHA" || true)
              if [[ "$status" == "200" ]] && grep -Fq "$marker" "$output"; then
                echo "PASS HTTP 200 + expected content: $url"
                return 0
              fi
              echo "Attempt $attempt: status=$status or stale/missing content for $url"
              sleep 12
            done
            echo "::error::The public econometrics site did not update: $url"
            return 1
          }
          check "$SITE/" /tmp/econometrics-index.html "计量经济学120天"
          check "$SITE/catalog.js" /tmp/econometrics-catalog.js "\"url\": \"lessons/$LATEST_ID.html\""
          check "$SITE/lessons/$LATEST_ID.html" /tmp/econometrics-lesson.html "$LATEST_TITLE"
          # Confirm the personal completion feature is present in the deployed HTML and assets.
          check "$SITE/study-progress.js" /tmp/econometrics-progress.js "research-learning-hub:econometrics:completed:v1"
          check "$SITE/study-progress.css" /tmp/econometrics-progress.css "econ-complete-panel"
          grep -Fq 'study-progress.js' /tmp/econometrics-index.html
          grep -Fq 'study-progress.js' /tmp/econometrics-lesson.html
          grep -Fq "href=\"lessons/$LATEST_ID.html\"" /tmp/econometrics-index.html
          grep -Fq '<pre' /tmp/econometrics-lesson.html
          echo "Verified newest econometrics course $LATEST_ID on public GitHub Pages."

  verify-public-math:
    name: Verify public mathematics pages
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out main source
        uses: actions/checkout@v4

      - name: Verify HTTPS catalog and every published mathematics lesson
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SITE="https://ericywh.github.io/research-learning-hub/math"
          node <<'NODE' > /tmp/math-pages.tsv
          const fs=require('node:fs'),vm=require('node:vm');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/math/catalog.js','utf8'),context);
          const chapters=context.window.MATH_COURSE.chapters;
          if(chapters.length!==6)throw Error('Unexpected mathematics chapter count');
          const lessons=chapters.flatMap(x=>x.lessons);
          if(lessons.length!==73)throw Error('Expected 73 mathematics lessons');
          let count=0;
          for(const l of lessons) {
            if(!l.published)continue;
            if(!/^lessons\/[\w.-]+\.html$/.test(l.url||''))throw Error('Unsafe lesson URL');
            const file='docs/math/'+l.url;
            if(!fs.existsSync(file))throw Error('Missing published source: '+file);
            if(fs.readFileSync(file,'utf8').length<1500)throw Error('Incomplete HTML: '+file);
            const marker=l.title.split(/[？：]/)[0];
            if(!fs.readFileSync(file,'utf8').includes(marker))throw Error('Lesson title marker missing: '+file);
            console.log(l.url+'\t'+marker);
            count++;
          }
          if(!count)throw Error('No published mathematics lessons');
          NODE
          check() {
            local url="$1" expected="$2" output="$3" status
            for attempt in $(seq 1 10); do
              status=$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$output" -w '%{http_code}' "$url?verify=$DEPLOY_SHA" || true)
              if [[ "$status" == "200" ]] && grep -Fq "$expected" "$output"; then
                echo "PASS HTTP 200 plus content marker: $url"
                return 0
              fi
              echo "Attempt $attempt: status=$status, expected marker missing at $url"
              sleep 12
            done
            echo "::error::GitHub Pages mathematics HTTPS validation failed for $url"
            return 1
          }
          check "$SITE/" '每日10分钟数学微课程' /tmp/math-index.html
          check "$SITE/catalog.js" 'window.MATH_COURSE=' /tmp/math-catalog.js
          i=0
          while IFS=$'\t' read -r lesson title; do
            i=$((i+1))
            check "$SITE/$lesson" "$title" "/tmp/math-lesson-$i.html"
            grep -Fq "$lesson" /tmp/math-catalog.js || {
              echo "::error::Public mathematics catalog does not link $lesson"
              exit 1
            }
          done </tmp/math-pages.tsv
          echo "Mathematics GitHub Pages HTTPS verification passed for $i published lesson pages."

