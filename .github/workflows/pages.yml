  verify-prepared-econometrics:
    name: Verify all 100 econometrics prelecture pages over HTTPS
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@v4
      - name: Verify 10 chapter guides and 100 prelecture pages (HTTP 200 and content)
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'docs/econometrics-prepared';
          const lessons = fs.readdirSync(path.join(root, 'lessons'))
            .filter(f => /^\d{2}-\d{2}\.html$/.test(f))
            .map(f => 'lessons/' + f).sort();
          const chapterGuides = fs.readdirSync(root)
            .filter(f => /^chapter-\d{2}\.html$/.test(f)).sort();
          if (lessons.length !== 100 || chapterGuides.length !== 10)
            throw Error('Expected 100 prepared lesson pages and 10 chapter guides');
          const files = ['index.html', ...chapterGuides, ...lessons];
          const base = 'https://ericywh.github.io/research-learning-hub/econometrics-prepared/';
          const dep = process.env.DEPLOY_SHA.slice(0, 12);
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          async function check(file) {
            const local = fs.readFileSync(path.join(root, file), 'utf8');
            const marker = local.match(/<title>([^<]+)<\/title>/)?.[1];
            if (!marker || !local.includes('<body') || !local.includes('</body>'))
              throw Error('Local HTML invalid: ' + file);
            if (file.startsWith('lessons/')) {
              if ((local.match(/<section class="paper"/g) || []).length !== 7 ||
                  (local.match(/<pre>/g) || []).length !== 2 ||
                  !local.includes('预编') || !local.includes('Stata') || !local.includes('Python'))
                throw Error('Prepared lesson lacks required scaffolding: ' + file);
            }
            const url = base + file + '?deploy=' + dep;
            let last = '';
            for (let attempt=1; attempt<=5; attempt++) {
              try {
                const res = await fetch(url, {signal: AbortSignal.timeout(20000)});
                if (res.status !== 200) throw Error('HTTP ' + res.status);
                const html = await res.text();
                if (!html.includes(marker) || !html.includes('<body'))
                  throw Error('Expected title/body missing');
                if (file.startsWith('lessons/') && !html.includes('参考答案'))
                  throw Error('Practice answers missing');
                return;
              } catch (err) {
                last = String(err);
                if (attempt < 5) await sleep(1500 * attempt);
              }
            }
            throw Error('Public page failed after retries: ' + file + ': ' + last);
          }
          async function main() {
            for (let i=0;i<files.length;i+=8) {
              await Promise.all(files.slice(i,i+8).map(check));
              console.log('Verified',Math.min(i+8,files.length),'of',files.length,'HTTPS pages');
            }
            console.log('PASS: all 100 lesson preparations + 10 chapters + index are publicly readable');
          }
          main().catch(err => { console.error(err); process.exitCode=1; });
          NODE

  verify-canonical-econometrics:
    name: Verify DAY21-120 taught-state lessons over HTTPS
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out source commit
        uses: actions/checkout@v4
      - name: Verify 120 catalogue records and 100 updated lesson pages
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),path=require('node:path');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('docs/econometrics/catalog.js','utf8'),context);
          const lessons=context.window.ECON_COURSE.chapters.flatMap(c=>c.lessons);
          const expected=lessons.filter(l=>l.number>=21);
          if(lessons.length!==120||expected.length!==100||
             lessons.some(l=>!l.published||l.url!=='lessons/'+l.id+'.html'))
             throw Error('All 120 canonical course records must be published with canonical links');
          const base='https://ericywh.github.io/research-learning-hub/econometrics/';
          const suffix='?commit='+process.env.DEPLOY_SHA.slice(0,12);
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function check(lesson){
            const file=path.join('docs/econometrics',lesson.url);
            const html=fs.readFileSync(file,'utf8');
            const heading='第'+lesson.chapter+'章·第'+lesson.section+'节｜'+lesson.title;
            if(!html.includes(heading)||!html.includes('<span class="badge">已授课</span>')||
               !html.includes('name="course-status" content="taught"')||
               (html.match(/<section class="paper"/g)||[]).length!==7||
               (html.match(/<pre>/g)||[]).length!==2||
               !html.includes('Stata')||!html.includes('Python')||!html.includes('答案'))
              throw Error('Canonical source incomplete or state mismatch: '+lesson.id);
            let reason='';
            for(let attempt=0;attempt<6;attempt++){
              try{
                const response=await fetch(base+lesson.url+suffix,{signal:AbortSignal.timeout(20000)});
                if(response.status!==200)throw Error('HTTP '+response.status);
                const deployed=await response.text();
                if(!deployed.includes(heading)||!deployed.includes('<span class="badge">已授课</span>')||
                   !deployed.includes('name="course-status" content="taught"')||
                   !deployed.includes('Stata')||!deployed.includes('Python')||
                   !deployed.includes('答案')||
                   (deployed.match(/<section class="paper"/g)||[]).length!==7)
                   throw Error('Public lesson stale or incomplete');
                return;
              }catch(err){reason=String(err);if(attempt<5)await wait(2000*(attempt+1));}
            }
            throw Error('DAY '+lesson.number+' failed: '+reason);
          }
          async function main(){
            const homepage=await fetch(base+suffix);
            const homepageText=await homepage.text();
            if(homepage.status!==200||!homepageText.includes('已授课')||
               homepageText.includes('正文已上线·待正式授课'))
              throw Error('Course homepage still shows planned status');
            const served=await fetch(base+'catalog.js'+suffix);
            if(served.status!==200)throw Error('Deployed catalogue HTTP '+served.status);
            const ctx={window:{}};
            vm.runInNewContext(await served.text(),ctx);
            const entries=ctx.window.ECON_COURSE.chapters.flatMap(c=>c.lessons);
            if(entries.length!==120||entries.filter(l=>l.published&&l.url==='lessons/'+l.id+'.html').length!==120)
              throw Error('Deployed catalogue must contain 120 taught-state records');
            for(let i=0;i<expected.length;i+=8){
              await Promise.all(expected.slice(i,i+8).map(check));
              console.log('Verified treated-as-taught canonical pages:',Math.min(i+8,100),'/100');
            }
            console.log('PASS 120/120 catalogue status and 100/100 canonical lesson HTML pages over HTTPS');
          }
          main().catch(err=>{console.error(err);process.exitCode=1;});
          NODE

  verify-public-econometrics-word:
    name: Verify all eleven Word files over HTTPS
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployed chapter DOCX files are accessible and valid
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ericywh.github.io/research-learning-hub/econometrics/word"
          mkdir -p /tmp/word-download-check
          for n in $(seq -w 1 10); do
            url="$BASE/econometrics-chapter-$n.docx"
            curl -fLsS --connect-timeout 10 --max-time 60 "$url" -o "/tmp/word-download-check/chapter-$n.docx"
            unzip -t "/tmp/word-download-check/chapter-$n.docx" | grep -Fq 'No errors detected'
          done
          curl -fLsS --connect-timeout 10 --max-time 90 "$BASE/econometrics-all-120-lessons.docx" -o /tmp/word-download-check/all.docx
          unzip -t /tmp/word-download-check/all.docx | grep -Fq 'No errors detected'
          curl -fLsS --connect-timeout 10 --max-time 30 "$BASE/manifest.json" -o /tmp/word-download-check/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/word-download-check/manifest.json').read_text())
          assert len(m['documents'])==11 and m['lessons']==120
          assert m['documents'][-1]['lessons']==120
          print('PASS 11 HTTPS Word documents, valid DOCX archives, 120 lesson manifest')
          PY
